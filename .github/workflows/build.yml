name: Build

on:
  push:
    branches: [ master ]
    # version tags (e.g. 0.18) also publish a release
    tags: [ '[0-9]*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    env:
      # last pocketsphinx revision before the 5.0 rewrite: the engine uses its
      # old API (and sphinxbase), and it still ships Visual Studio solutions
      POCKETSPHINX_REF: 588ab6371a1e1c94c10d4ad772b0c4732e1905e6
      # FFmpeg 5.1: the engine uses the old channel layout API, removed in 7.0
      FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/5.1.2/ffmpeg-5.1.2-full_build-shared.zip
      FFMPEG_NAME: ffmpeg-5.1.2-full_build-shared

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # before the long build: a release needs its CHANGELOG.md entry
      - name: Check changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: python .github/release_notes.py "${{ github.ref_name }}" release-notes.md

      - uses: microsoft/setup-msbuild@v2

      - name: Get sphinxbase and pocketsphinx sources
        shell: bash
        run: |
          git clone --depth 1 https://github.com/cmusphinx/sphinxbase.git deps/sphinxbase
          git clone https://github.com/cmusphinx/pocketsphinx.git deps/pocketsphinx
          git -C deps/pocketsphinx checkout --quiet "$POCKETSPHINX_REF"

      - name: Build sphinxbase and pocketsphinx
        run: |
          $props = '/p:Configuration=Release', '/p:Platform=x64', '/p:PlatformToolset=v143', '/p:WindowsTargetPlatformVersion=10.0'
          msbuild deps\sphinxbase\sphinxbase.sln /m /t:sphinxbase @props
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild deps\pocketsphinx\pocketsphinx.sln /m /t:pocketsphinx @props
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse deps\sphinxbase\bin, deps\pocketsphinx\bin -Include *.dll, *.lib | Select-Object -ExpandProperty FullName

      - name: Get FFmpeg
        shell: bash
        run: |
          curl -sSL -o ffmpeg.zip "$FFMPEG_URL"
          7z x -y -odeps ffmpeg.zip > /dev/null
          mv "deps/$FFMPEG_NAME" deps/ffmpeg
          ls deps/ffmpeg deps/ffmpeg/lib deps/ffmpeg/bin

      - name: Add native libraries to PATH
        shell: bash
        run: |
          for d in deps/ffmpeg/bin deps/sphinxbase/bin/Release/x64 deps/pocketsphinx/bin/Release/x64; do
            cygpath -w "$GITHUB_WORKSPACE/$d" >> "$GITHUB_PATH"
          done

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt "pysubs2>=1.6,<2" wxPython "faster-whisper==1.2.1" sentencepiece pyinstaller

      - name: Build engine
        env:
          FFMPEG_DIR: ${{ github.workspace }}\deps\ffmpeg
          SPHINXBASE_DIR: ${{ github.workspace }}\deps\sphinxbase
          POCKETSPHINX_DIR: ${{ github.workspace }}\deps\pocketsphinx
        run: |
          python setup.py build_py
          python setup.py build_ext --inplace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Python 3.8+ does not look for extension dependencies in PATH,
          # native libraries must be next to the engine
          Copy-Item deps\ffmpeg\bin\*.dll, deps\sphinxbase\bin\Release\x64\sphinxbase.dll, deps\pocketsphinx\bin\Release\x64\pocketsphinx.dll -Destination .
          Get-ChildItem gizmo*.pyd, *.dll | Select-Object Name, Length

      # timing logic on synthetic films, and the matching method per language
      # pair (needs the engine built above)
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test
        run: |
          python -c "import gizmo; print('engine:', gizmo.__file__)"
          python -c "import sys; sys.path.insert(0, 'subsync/synchro'); import transcribe; print('whisper in process:', transcribe._hasModule())"
          python -c "import subsync.synchro.synchronizer, subsync.gui.mainwin; print('subsync modules: ok')"

      - name: Package
        run: |
          pyinstaller --noconfirm windows.spec
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item LICENSE dist\subsync\
          Get-ChildItem dist\subsync | Select-Object -First 40 Name, Length

      - name: Test package
        run: |
          dist\subsync\subsync-cmd.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # self-extracting archive like the original SubSync's portable exe: it
      # asks where to unpack and creates a subsync folder with the app
      - name: Make portable exe
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version=$(python -c "from subsync.version import version_short; print(version_short)")
          fi
          name="subsync-$version-portable-amd64.exe"
          sfx=$(cygpath -w "/c/Program Files/7-Zip/7z.sfx")
          (cd dist && 7z a -t7z -mx=9 -mmt=on "-sfx$sfx" "../$name" subsync > /dev/null)
          ls -l "$name"
          echo "PORTABLE=$name" >> "$GITHUB_ENV"

      - name: Test portable exe
        shell: bash
        run: |
          "./$PORTABLE" -y -oportable-test
          portable-test/subsync/subsync-cmd.exe --version
          rm -rf portable-test

      - uses: actions/upload-artifact@v4
        with:
          name: subsync-windows-x64
          path: dist/subsync
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: subsync-portable-windows-x64
          path: ${{ env.PORTABLE }}
          compression-level: 0
          if-no-files-found: error

      # files for the release page, published by the release job below
      - name: Release files
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          (cd dist && 7z a -tzip -mx=7 "../release/subsync-$TAG-windows-x64.zip" subsync > /dev/null)
          cp "$PORTABLE" release/
          ls -l release

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-windows
          path: release/*
          compression-level: 0

  linux:
    # the oldest supported Ubuntu: the build runs on it and newer Linux
    # systems (glibc 2.35 or later)
    runs-on: ubuntu-22.04
    env:
      POCKETSPHINX_REF: 588ab6371a1e1c94c10d4ad772b0c4732e1905e6
      PREFIX: ${{ github.workspace }}/deps/install

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # FFmpeg 4.4 from Ubuntu: the engine's old channel layout API is there
      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool bison             pkg-config libavdevice-dev libavformat-dev libavfilter-dev libavcodec-dev             libswresample-dev libswscale-dev libavutil-dev             libgtk-3-0 libnotify4 libsdl2-2.0-0 libsm6 libxtst6

      - name: Build sphinxbase and pocketsphinx
        run: |
          set -e
          git clone --depth 1 https://github.com/cmusphinx/sphinxbase.git deps/sphinxbase
          git clone https://github.com/cmusphinx/pocketsphinx.git deps/pocketsphinx
          git -C deps/pocketsphinx checkout --quiet "$POCKETSPHINX_REF"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          (cd deps/sphinxbase && ./autogen.sh --prefix="$PREFIX" --without-python && make -j"$(nproc)" && make install)
          (cd deps/pocketsphinx && ./autogen.sh --prefix="$PREFIX" --without-python && make -j"$(nproc)" && make install)
          ls "$PREFIX/lib"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PREFIX/lib" >> "$GITHUB_ENV"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt "pysubs2>=1.6,<2" "faster-whisper==1.2.1" sentencepiece pyinstaller
          # ready-made wxPython for Ubuntu 22.04 (building it takes 40 minutes)
          pip install --only-binary wxPython -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04/ wxPython

      - name: Build engine
        run: |
          python setup.py build_py
          python setup.py build_ext --inplace
          ls -l gizmo*.so

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test
        run: |
          python -c "import gizmo; print('engine:', gizmo.__file__)"
          python -c "import sys; sys.path.insert(0, 'subsync/synchro'); import transcribe; print('whisper in process:', transcribe._hasModule())"
          python -c "import subsync.synchro.synchronizer, subsync.gui.mainwin; print('subsync modules: ok')"

      - name: Package
        run: |
          pyinstaller --noconfirm linux.spec
          cp LICENSE dist/subsync/
          du -sh dist/subsync
          # biggest parts of the package
          find dist/subsync -type f -exec du -k {} + | sort -rn | head -40

      - name: Test package
        run: |
          dist/subsync/subsync-cmd --version
          dist/subsync/subsync --cli --version

      - name: Archive
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version=$(python -c "from subsync.version import version_short; print(version_short)")
          fi
          mkdir release
          tar czf "release/subsync-$version-linux-x86_64.tar.gz" -C dist subsync
          ls -l release

      - name: Test archive
        run: |
          mkdir unpack-test
          tar xzf release/*.tar.gz -C unpack-test
          unpack-test/subsync/subsync-cmd --version
          rm -rf unpack-test

      - uses: actions/upload-artifact@v4
        with:
          name: subsync-linux-x86_64
          path: release/*
          compression-level: 0
          if-no-files-found: error

  release:
    # version tags publish both builds on one release page
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ windows, linux ]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: files
          pattern: '{release-windows,subsync-linux-x86_64}'
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l files
          python3 .github/release_notes.py "$TAG" release-notes.md
          gh release create "$TAG" files/* --title "SubSync $TAG" --notes-file release-notes.md
